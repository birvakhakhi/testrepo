<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WeatherWave — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#deedf8;--card-bg:rgba(255,255,255,0.84);--card-border:rgba(255,255,255,0.95);
      --text:#1a2a3a;--muted:#5e7d99;--accent:#2563eb;--accent2:#0ea5e9;
      --shadow:0 4px 24px rgba(30,80,140,0.10);--r:20px;--rs:12px;
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);transition:background 0.6s,color 0.3s}
    body.dark{--bg:#0f172a;--card-bg:rgba(30,41,59,0.9);--card-border:rgba(51,65,85,0.8);--text:#e2e8f0;--muted:#94a3b8;--shadow:0 4px 24px rgba(0,0,0,0.4)}

    /* ── NAV ── */
    nav{display:flex;align-items:center;justify-content:space-between;padding:16px 48px;background:rgba(222,237,248,0.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(180,210,240,0.4);transition:background 0.3s}
    body.dark nav{background:rgba(15,23,42,0.95);border-bottom-color:rgba(51,65,85,0.6)}
    .logo{font-family:'DM Serif Display',serif;font-size:1.5rem;color:#1a6bb5;letter-spacing:-0.5px;white-space:nowrap}
    .logo span{color:#2e8fd8}
    .nav-center{display:flex;gap:10px;align-items:center;flex:1;max-width:500px;margin:0 28px}
    .sw{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;border:1.5px solid #b8d9f5;padding:8px 18px;flex:1;transition:border-color 0.2s,box-shadow 0.2s}
    body.dark .sw{background:#1e293b;border-color:#334155}
    .sw:focus-within{border-color:#2e8fd8;box-shadow:0 0 0 3px rgba(46,143,216,0.15)}
    .sw svg{color:var(--muted);flex-shrink:0}
    .sw input{border:none;outline:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:0.96rem;color:var(--text);width:100%}
    .sw input::placeholder{color:var(--muted)}
    .btn{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:9px 22px;font-family:'DM Sans',sans-serif;font-size:0.92rem;font-weight:600;cursor:pointer;transition:background 0.2s,transform 0.1s;white-space:nowrap}
    .btn:hover{background:#1d4ed8}.btn:active{transform:scale(0.97)}
    .nav-actions{display:flex;gap:10px;align-items:center}
    .icon-btn{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:999px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;color:var(--muted)}
    .icon-btn:hover{color:var(--accent);border-color:var(--accent);transform:scale(1.08)}

    /* autocomplete */
    .search-wrapper{position:relative;flex:1}
    .autocomplete{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:var(--rs);border:1.5px solid #b8d9f5;box-shadow:0 8px 32px rgba(30,80,140,0.15);z-index:300;overflow:hidden}
    body.dark .autocomplete{background:#1e293b;border-color:#334155}
    .autocomplete-item{padding:10px 18px;cursor:pointer;font-size:0.92rem;display:flex;align-items:center;gap:10px;transition:background 0.15s}
    .autocomplete-item:hover{background:rgba(37,99,235,0.08)}
    .autocomplete-item svg{color:var(--muted);flex-shrink:0}

    /* ── MAIN ── */
    main{max-width:1240px;margin:0 auto;padding:32px 24px 60px}

    /* ── TABS ── */
    .tabs{display:flex;gap:6px;margin-bottom:24px;background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:999px;padding:5px;width:fit-content;box-shadow:var(--shadow)}
    .tab{padding:8px 22px;border-radius:999px;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--muted);border:none;background:transparent;font-family:'DM Sans',sans-serif}
    .tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(37,99,235,0.3)}

    /* ── UNIT TOGGLE ── */
    .unit-toggle{display:flex;gap:0;background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:999px;overflow:hidden;box-shadow:var(--shadow)}
    .unit-btn{padding:7px 16px;font-size:0.85rem;font-weight:600;cursor:pointer;border:none;background:transparent;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all 0.2s}
    .unit-btn.active{background:var(--accent);color:#fff}

    /* ── HERO ── */
    .hero{border-radius:var(--r);padding:44px 48px;color:#fff;position:relative;overflow:hidden;margin-bottom:28px;min-height:240px;display:flex;align-items:flex-end;justify-content:space-between;box-shadow:0 8px 40px rgba(30,90,180,0.25);transition:background 0.6s}
    .hero.clear{background:linear-gradient(135deg,#3a9fd6,#1e6db5,#1557a0)}
    .hero.cloudy{background:linear-gradient(135deg,#6b8cba,#4a6fa5,#2d5080)}
    .hero.rain{background:linear-gradient(135deg,#4a7fa5,#2d5f85,#1a3d5c)}
    .hero.storm{background:linear-gradient(135deg,#3d5a80,#2c3e6b,#1a2847)}
    .hero.snow{background:linear-gradient(135deg,#7ab8d4,#5a9ab8,#3d7a9a)}
    .hero.fog{background:linear-gradient(135deg,#8a9bb5,#6d8099,#516080)}
    .hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,0.07);pointer-events:none}
    .hero::after{content:'';position:absolute;bottom:-80px;left:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.04);pointer-events:none}
    .hero-left{z-index:1}
    .hero-city{font-size:2.8rem;font-weight:600;letter-spacing:-1px;margin-bottom:2px}
    .hero-region{font-size:0.95rem;opacity:0.7;margin-bottom:18px}
    .hero-temp{font-size:4.8rem;font-weight:300;letter-spacing:-3px;line-height:1;margin-bottom:6px}
    .hero-feels{font-size:0.93rem;opacity:0.8;margin-bottom:20px}
    .hero-stats{display:flex;gap:10px;flex-wrap:wrap}
    .stat{background:rgba(255,255,255,0.18);border-radius:var(--rs);padding:8px 16px;display:flex;flex-direction:column;gap:2px;min-width:88px;backdrop-filter:blur(4px)}
    .stat .val{font-weight:600;font-size:1rem}
    .stat .lbl{opacity:0.72;font-size:0.78rem}
    .hero-right{z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
    .hero-icon{font-size:6rem;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.25));animation:float 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .hero-cond{font-size:1.05rem;opacity:0.9;font-weight:500}
    .hero-hi-lo{font-size:0.88rem;opacity:0.72;margin-top:4px}
    .weather-alert{background:rgba(239,68,68,0.25);border:1px solid rgba(239,68,68,0.4);border-radius:var(--rs);padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:0.88rem;backdrop-filter:blur(4px)}

    /* ── SECTION TITLE ── */
    .sec-title{font-size:0.76rem;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:14px}

    /* ── HOURLY ── */
    .hourly-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:#b8d9f5 transparent}
    .hourly-scroll::-webkit-scrollbar{height:4px}
    .hourly-scroll::-webkit-scrollbar-thumb{background:#b8d9f5;border-radius:4px}
    .hour-card{min-width:90px;background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:var(--rs);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;flex-shrink:0;box-shadow:var(--shadow)}
    .hour-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(30,80,140,0.16)}
    .hour-card.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .h-time{font-size:0.8rem;font-weight:600;opacity:0.8}
    .h-icon{font-size:1.65rem}
    .h-temp{font-size:1rem;font-weight:700}
    .h-rain{font-size:0.72rem;opacity:0.7;color:var(--accent2)}
    .hour-card.active .h-rain{color:#bfdbfe}

    /* ── GRIDS ── */
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
    @media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

    /* ── CARD ── */
    .card{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:var(--r);padding:28px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}

    /* ── 3-DAY ── */
    .day-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid rgba(180,210,240,0.25)}
    body.dark .day-row{border-bottom-color:rgba(51,65,85,0.4)}
    .day-row:last-child{border-bottom:none}
    .day-name{font-weight:600;font-size:0.95rem;width:46px;flex-shrink:0}
    .day-icon-col{font-size:1.5rem;width:34px;text-align:center}
    .day-cond{flex:1;font-size:0.86rem;color:var(--muted)}
    .day-temp-bar{display:flex;align-items:center;gap:8px;min-width:120px}
    .day-low{font-size:0.88rem;color:var(--muted);width:28px;text-align:right}
    .day-high{font-size:0.88rem;font-weight:600;width:28px}
    .temp-range{flex:1;height:4px;background:rgba(180,210,240,0.4);border-radius:2px;position:relative}
    body.dark .temp-range{background:rgba(51,65,85,0.6)}
    .temp-range-fill{position:absolute;height:100%;background:linear-gradient(to right,#f97316,#ef4444);border-radius:2px}
    .day-rain-pct{font-size:0.75rem;color:var(--accent2);width:30px;text-align:right}

    /* ── AIR DETAILS ── */
    .air-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .air-lbl{font-size:0.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
    .air-val{font-size:1.85rem;font-weight:300;color:var(--text)}
    .air-val small{font-size:0.88rem;color:var(--muted);font-weight:400}
    .air-bar{height:4px;background:rgba(180,210,240,0.35);border-radius:2px;margin-top:8px;overflow:hidden}
    body.dark .air-bar{background:rgba(51,65,85,0.5)}
    .air-fill{height:100%;background:linear-gradient(to right,var(--accent2),var(--accent));border-radius:2px;transition:width 1.2s cubic-bezier(0.4,0,0.2,1)}

    /* ── SUN CARD ── */
    .sun-card{background:linear-gradient(135deg,#fdf6e3,#fef3c7);border-color:#fde68a}
    body.dark .sun-card{background:linear-gradient(135deg,#292218,#2d2510);border-color:#78350f}
    .sun-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(251,191,36,0.2)}
    .sun-row:last-child{border-bottom:none}
    .sun-lbl{display:flex;align-items:center;gap:10px;font-size:0.93rem;font-weight:500}
    .sun-val{font-size:0.95rem;font-weight:600}
    .uv-bar{height:6px;border-radius:3px;background:linear-gradient(to right,#84cc16,#facc15,#f97316,#ef4444);margin-top:8px;position:relative}
    .uv-dot{width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid #ef4444;position:absolute;top:50%;transform:translateY(-50%);transition:left 0.8s}
    .daylight-bar{height:8px;border-radius:4px;background:rgba(180,210,240,0.3);position:relative;margin-top:12px;overflow:visible}
    .daylight-fill{position:absolute;height:100%;background:linear-gradient(to right,#f97316,#facc15,#f97316);border-radius:4px;opacity:0.7}
    .sun-now-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#f97316;border:2px solid #fff;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(249,115,22,0.6)}

    /* ── RAIN CHART ── */
    .rain-chart{display:flex;align-items:flex-end;gap:6px;height:80px;padding-top:10px}
    .rain-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
    .rain-bar-outer{width:100%;background:rgba(180,210,240,0.3);border-radius:4px 4px 0 0;position:relative;height:60px;display:flex;align-items:flex-end}
    body.dark .rain-bar-outer{background:rgba(51,65,85,0.4)}
    .rain-bar-inner{width:100%;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:4px 4px 0 0;transition:height 1s cubic-bezier(0.4,0,0.2,1);min-height:2px}
    .rain-bar-label{font-size:0.68rem;color:var(--muted)}

    /* ── WIND COMPASS ── */
    .compass-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
    .compass{width:120px;height:120px;border-radius:50%;border:2px solid rgba(180,210,240,0.4);position:relative;background:var(--card-bg)}
    body.dark .compass{border-color:rgba(51,65,85,0.6)}
    .compass-ring{position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(180,210,240,0.3)}
    .compass-dir{position:absolute;font-size:0.68rem;font-weight:700;color:var(--muted)}
    .compass-dir.n{top:6px;left:50%;transform:translateX(-50%)}
    .compass-dir.s{bottom:6px;left:50%;transform:translateX(-50%)}
    .compass-dir.e{right:8px;top:50%;transform:translateY(-50%)}
    .compass-dir.w{left:8px;top:50%;transform:translateY(-50%)}
    .compass-needle{position:absolute;top:50%;left:50%;width:4px;height:44px;margin-left:-2px;margin-top:-38px;transform-origin:bottom center;border-radius:2px 2px 0 0;background:linear-gradient(to bottom,#ef4444,#ef4444 50%,var(--muted) 50%)}
    .compass-center{position:absolute;top:50%;left:50%;width:10px;height:10px;border-radius:50%;background:var(--text);transform:translate(-50%,-50%)}
    .wind-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
    .wind-stat{text-align:center}
    .wind-stat-val{font-size:1.3rem;font-weight:600;color:var(--text)}
    .wind-stat-lbl{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

    /* ── FEELS LIKE DETAIL ── */
    .feels-card{background:linear-gradient(135deg,#e8f4fd,#d0eafb);border-color:#bdd6f0}
    body.dark .feels-card{background:linear-gradient(135deg,#162033,#1a2840);border-color:#1e3a5f}
    .feels-big{font-size:3.5rem;font-weight:300;color:var(--accent);letter-spacing:-2px;margin:8px 0}
    .feels-desc{font-size:0.88rem;color:var(--muted);line-height:1.5}

    /* ── FAVORITES ── */
    .fav-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px}
    .fav-strip::-webkit-scrollbar{display:none}
    .fav-chip{display:flex;align-items:center;gap:8px;background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:999px;padding:8px 16px;cursor:pointer;transition:all 0.2s;white-space:nowrap;box-shadow:var(--shadow);font-size:0.88rem;flex-shrink:0}
    .fav-chip:hover{border-color:var(--accent);color:var(--accent)}
    .fav-chip .fav-temp{font-weight:700;color:var(--accent)}
    .fav-chip .fav-remove{color:var(--muted);font-size:0.75rem;margin-left:4px;line-height:1}
    .fav-chip .fav-remove:hover{color:#ef4444}
    .fav-add-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1.5px dashed rgba(180,210,240,0.6);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:0.88rem;color:var(--muted);transition:all 0.2s;white-space:nowrap;flex-shrink:0;font-family:'DM Sans',sans-serif}
    .fav-add-btn:hover{border-color:var(--accent);color:var(--accent)}

    /* ── AQI ── */
    .aqi-card{margin-top:20px}
    .aqi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .aqi-status{font-size:0.93rem;font-weight:600}
    .aqi-badge{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:999px;padding:4px 14px;font-size:0.84rem;font-weight:700;color:var(--accent)}
    .aqi-bar{height:12px;border-radius:6px;background:linear-gradient(to right,#22c55e,#84cc16,#facc15,#f97316,#ef4444);position:relative;margin:10px 0}
    .aqi-dot{width:16px;height:16px;border-radius:50%;background:var(--text);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.2);position:absolute;top:50%;transform:translate(-50%,-50%);transition:left 0.8s}
    .aqi-scale{display:flex;justify-content:space-between;font-size:0.7rem;color:var(--muted)}

    /* ── MINI MAP PLACEHOLDER ── */
    .map-card{overflow:hidden;padding:0}
    .map-inner{background:linear-gradient(145deg,#c8e6f5,#a8d4ef,#88c2e8);height:200px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:var(--r)}
    .map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-80%);font-size:2.5rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));animation:bounce 1.5s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translate(-50%,-80%)}50%{transform:translate(-50%,-100%)}}
    .map-label{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.55);color:#fff;border-radius:999px;padding:4px 14px;font-size:0.82rem;font-weight:600;backdrop-filter:blur(8px);white-space:nowrap}
    .map-rings{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
    .ring{position:absolute;border-radius:50%;border:1.5px solid rgba(37,99,235,0.25);transform:translate(-50%,-50%);animation:ripple 2.5s ease-out infinite}
    .ring:nth-child(1){width:60px;height:60px;animation-delay:0s}
    .ring:nth-child(2){width:110px;height:110px;animation-delay:0.5s}
    .ring:nth-child(3){width:160px;height:160px;animation-delay:1s}
    @keyframes ripple{0%{opacity:0.6;transform:translate(-50%,-50%) scale(0.8)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}

    /* ── WEATHER TIPS ── */
    .tip-card{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#86efac}
    body.dark .tip-card{background:linear-gradient(135deg,#052e16,#14532d);border-color:#166534}
    .tip-icon{font-size:2rem;margin-bottom:8px}
    .tip-title{font-size:0.88rem;font-weight:700;color:#15803d;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
    body.dark .tip-title{color:#4ade80}
    .tip-text{font-size:0.9rem;line-height:1.6;color:var(--text)}

    /* ── COMPARE ── */
    .compare-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
    .compare-city{text-align:center}
    .compare-temp{font-size:2.8rem;font-weight:300;letter-spacing:-1px;color:var(--accent)}
    .compare-name{font-size:1rem;font-weight:600;margin-bottom:4px}
    .compare-cond{font-size:0.85rem;color:var(--muted)}
    .compare-vs{font-size:1.5rem;font-weight:700;color:var(--muted);padding:0 8px}
    .compare-diff{text-align:center;margin-top:16px;font-size:0.9rem;color:var(--muted)}
    .compare-diff strong{color:var(--text)}
    .compare-input-row{display:flex;gap:10px;margin-bottom:20px}
    .compare-input{flex:1;border:1.5px solid var(--card-border);border-radius:var(--rs);padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:0.92rem;background:var(--card-bg);color:var(--text);outline:none;transition:border-color 0.2s}
    .compare-input:focus{border-color:var(--accent)}

    /* ── STATE ── */
    .state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;text-align:center;color:var(--muted);gap:16px}
    .spinner{width:42px;height:42px;border:3px solid rgba(180,210,240,0.4);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── MISC ── */
    .section{margin-bottom:26px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fadeUp 0.5s ease both}
    .fu1{animation-delay:0.06s}.fu2{animation-delay:0.12s}.fu3{animation-delay:0.18s}
    .fu4{animation-delay:0.24s}.fu5{animation-delay:0.30s}.fu6{animation-delay:0.36s}

    /* ── TOAST ── */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);border-radius:999px;padding:10px 24px;font-size:0.88rem;font-weight:600;z-index:999;transition:transform 0.3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
    .toast.show{transform:translateX(-50%) translateY(0)}

    /* ── RESPONSIVE ── */
    @media(max-width:640px){
      nav{padding:12px 16px;flex-wrap:wrap;gap:10px}
      .nav-center{max-width:100%;margin:0;order:3;width:100%}
      main{padding:20px 12px 40px}
      .hero{padding:28px 24px;flex-direction:column;align-items:flex-start;gap:20px}
      .hero-city{font-size:2rem}
      .hero-temp{font-size:3.5rem}
    }
  </style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CITIES_SUGGEST = ['Mumbai','Delhi','Bangalore','Chennai','Kolkata','Ahmedabad','Hyderabad','Pune','London','New York','Tokyo','Paris','Dubai','Singapore','Sydney','Toronto'];

/* ── helpers ── */
function wIcon(code){
  code=parseInt(code);
  if([395,392,389,386].includes(code)) return "⛈️";
  if([374,371,368,365,362,338,335,332,329,326,323,320,317,314,311].includes(code)) return "🌨️";
  if([308,305,302,299,296,293,266,263,356,353,359].includes(code)) return "🌧️";
  if([248,260,143].includes(code)) return "🌫️";
  if([185,182,179,176].includes(code)) return "🌦️";
  if(code===113) return "☀️";
  if(code===116) return "⛅";
  if(code===119||code===122) return "☁️";
  return "🌡️";
}
function wClass(code){
  code=parseInt(code);
  if([395,392,389,386].includes(code)) return "storm";
  if([338,335,332,329,326,323,320,317,314,311,374,371,368,365,362].includes(code)) return "snow";
  if([308,305,302,299,296,293,266,263,356,353,359,185,182,179,176].includes(code)) return "rain";
  if([248,260,143].includes(code)) return "fog";
  if(code===113) return "clear";
  if(code===116||code===119||code===122) return "cloudy";
  return "clear";
}
function wDesc(code,fallback){
  if(fallback) return fallback;
  const m={113:"Clear",116:"Partly Cloudy",119:"Cloudy",122:"Overcast",143:"Mist",176:"Light Rain",
    185:"Sleet",227:"Blowing Snow",248:"Fog",260:"Freezing Fog",263:"Drizzle",266:"Drizzle",
    293:"Light Rain",296:"Light Rain",299:"Moderate Rain",302:"Moderate Rain",305:"Heavy Rain",
    308:"Heavy Rain",323:"Light Snow",326:"Light Snow",329:"Moderate Snow",332:"Moderate Snow",
    338:"Heavy Snow",353:"Light Rain Shower",356:"Heavy Rain",362:"Light Sleet",368:"Light Snow",
    386:"Thundery Rain",389:"Heavy Thundery Rain",395:"Heavy Thundery Snow"};
  return m[parseInt(code)]||"Unknown";
}
function toC(f){ return Math.round((f-32)*5/9); }
function toF(c){ return Math.round(c*9/5+32); }
function dispTemp(c,unit){ return unit==='C'?`${c}°C`:`${toF(c)}°F`; }
function dispTempNum(c,unit){ return unit==='C'?c:toF(c); }
function feelsDesc(feels,temp){
  const d=feels-temp;
  if(d>3) return "It feels significantly hotter than the actual temperature due to high humidity.";
  if(d>0) return "It feels slightly warmer than the actual temperature.";
  if(d<-4) return "Wind chill makes it feel much colder than the actual temperature.";
  if(d<0) return "It feels slightly cooler than the actual temperature.";
  return "The temperature feels about the same as the actual reading.";
}
function weatherTip(code,temp,humidity){
  code=parseInt(code);
  if([386,389,395,392].includes(code)) return {icon:"⛈️",title:"Storm Warning",text:"Thunderstorms expected. Stay indoors if possible, avoid open areas, and keep away from windows."};
  if([308,305,302,299].includes(code)) return {icon:"☂️",title:"Heavy Rain Alert",text:"Carry a sturdy umbrella and wear waterproof shoes. Be cautious of flooded roads."};
  if([293,296,266,263,176].includes(code)) return {icon:"🌂",title:"Light Rain",text:"A light jacket and umbrella recommended. Roads may be slippery — drive carefully."};
  if([323,326,329,332,335,338].includes(code)) return {icon:"❄️",title:"Snow Day",text:"Bundle up with warm layers. Roads may be icy — allow extra travel time."};
  if(code===113 && temp>=35) return {icon:"🌡️",title:"Heat Alert",text:"Stay hydrated, seek shade and avoid strenuous outdoor activities between 11am–4pm."};
  if(code===113 && temp<=10) return {icon:"🧤",title:"Cold & Clear",text:"It's cold but sunny! Wear warm layers and enjoy the crisp weather."};
  if(humidity>=80) return {icon:"💧",title:"High Humidity",text:"High humidity today. Light, breathable clothing is recommended. Stay hydrated."};
  if(code===113) return {icon:"😎",title:"Great Weather!",text:"Perfect weather to head outdoors. Don't forget sunscreen if you'll be out long."};
  return {icon:"🌤️",title:"Mixed Conditions",text:"Partly cloudy skies. A light jacket may come in handy for later in the day."};
}
function aqiFromHumidity(humidity, code){
  // Simulate AQI from weather conditions (wttr.in doesn't provide real AQI)
  let base = Math.round(20 + humidity * 0.4);
  if([305,308,356,359].includes(parseInt(code))) base = Math.max(15, base-20);
  if([248,260,143].includes(parseInt(code))) base += 30;
  return Math.min(base, 200);
}
function aqiLabel(v){ if(v<=50)return{label:"Good",color:"#22c55e",pct:v/300*100}; if(v<=100)return{label:"Moderate",color:"#facc15",pct:25+v/400*100}; if(v<=150)return{label:"Unhealthy for Sensitive",color:"#f97316",pct:50+v/600*100}; return{label:"Unhealthy",color:"#ef4444",pct:80}; }
function windDir(deg){
  const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5)%16]||'N';
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function daylight(sr,ss){
  // parse "6:14 AM" format
  function toMin(s){
    if(!s) return 0;
    const m=s.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if(!m) return 0;
    let h=parseInt(m[1]);
    if(m[3].toUpperCase()==='PM'&&h!==12) h+=12;
    if(m[3].toUpperCase()==='AM'&&h===12) h=0;
    return h*60+parseInt(m[2]);
  }
  const now=new Date().getHours()*60+new Date().getMinutes();
  const s=toMin(sr), e=toMin(ss), total=e-s;
  const pctStart=(s/(24*60))*100;
  const pctLen=(total/(24*60))*100;
  const pctNow=Math.max(0,Math.min(100,(now-s)/total*100));
  return{pctStart,pctLen,pctNow};
}

/* ── fetch single city ── */
async function fetchCity(city){
  const r=await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
  if(!r.ok) throw new Error(`"${city}" not found`);
  const d=await r.json();
  if(!d.current_condition||!d.weather) throw new Error(`No data for "${city}"`);
  return d;
}

/* ── Main App ── */
function App(){
  const [input,setInput]=useState("Mumbai");
  const [query,setQuery]=useState("Mumbai");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [wx,setWx]=useState(null);
  const [activeH,setActiveH]=useState(0);
  const [unit,setUnit]=useState('C');
  const [dark,setDark]=useState(false);
  const [tab,setTab]=useState('today');
  const [favorites,setFavorites]=useState(['Mumbai','London','New York']);
  const [favData,setFavData]=useState({});
  const [suggests,setSuggests]=useState([]);
  const [showSug,setShowSug]=useState(false);
  const [compareCity,setCompareCity]=useState("London");
  const [compareInput,setCompareInput]=useState("London");
  const [compareWx,setCompareWx]=useState(null);
  const [compareLoading,setCompareLoading]=useState(false);
  const inputRef=useRef();

  // dark mode
  useEffect(()=>{ document.body.classList.toggle('dark',dark); },[dark]);

  // main fetch
  const doFetch=useCallback(async(city)=>{
    setLoading(true);setError(null);setWx(null);
    try{ const d=await fetchCity(city); setWx(d); setActiveH(0); }
    catch(e){ setError(e.message); }
    finally{ setLoading(false); }
  },[]);
  useEffect(()=>{ doFetch(query); },[query]);

  // autocomplete
  const handleInput=(v)=>{
    setInput(v);
    if(v.length>1){
      const s=CITIES_SUGGEST.filter(c=>c.toLowerCase().startsWith(v.toLowerCase()));
      setSuggests(s); setShowSug(s.length>0);
    } else { setShowSug(false); }
  };
  const handleSearch=()=>{ const t=input.trim(); if(!t)return; setQuery(t); setShowSug(false); };
  const pickSuggest=(c)=>{ setInput(c); setQuery(c); setShowSug(false); };

  // favorites fetch
  useEffect(()=>{
    favorites.forEach(async(city)=>{
      if(favData[city]) return;
      try{ const d=await fetchCity(city); setFavData(p=>({...p,[city]:d})); }catch(e){}
    });
  },[favorites]);

  const addFav=()=>{
    if(!wx||favorites.includes(query)) return showToast(`${query} already in favorites`);
    setFavorites(p=>[...p,query]); showToast(`Added ${query} to favorites ⭐`);
  };
  const removeFav=(c,e)=>{ e.stopPropagation(); setFavorites(p=>p.filter(x=>x!==c)); };

  // compare fetch
  const doCompare=async()=>{
    const t=compareInput.trim(); if(!t) return;
    setCompareCity(t); setCompareLoading(true); setCompareWx(null);
    try{ const d=await fetchCity(t); setCompareWx(d); }catch(e){}
    finally{ setCompareLoading(false); }
  };
  useEffect(()=>{ doCompare(); },[]);

  // location detect
  const useLocation=()=>{
    if(!navigator.geolocation) return showToast("Geolocation not supported");
    navigator.geolocation.getCurrentPosition(async(pos)=>{
      const {latitude:lat,longitude:lon}=pos.coords;
      const city=`${lat.toFixed(2)},${lon.toFixed(2)}`;
      setInput(city); setQuery(city);
    },()=>showToast("Location access denied"));
  };

  // derive display data
  let hero=null,hourly=[],daily=[],tip=null;
  if(wx){
    const cur=wx.current_condition[0];
    const todayFc=wx.weather[0];
    const code=parseInt(cur.weatherCode);
    const nowH=new Date().getHours();
    const srRaw=todayFc.astronomy?.[0]?.sunrise||"6:00 AM";
    const ssRaw=todayFc.astronomy?.[0]?.sunset||"6:30 PM";
    hero={
      city:query.split(',')[0].replace(/\d/g,'').trim()||query,
      region:todayFc.astronomy?.[0]?.moon_phase||"",
      date:new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
      temp:Math.round(parseFloat(cur.temp_C)),
      feels:Math.round(parseFloat(cur.FeelsLikeC)),
      humidity:parseInt(cur.humidity),
      wind:parseInt(cur.windspeedKmph),
      windDir:parseInt(cur.winddirDegree||0),
      windDirStr:cur.winddir16Point||'N',
      visibility:parseInt(cur.visibility),
      pressure:parseInt(cur.pressure),
      cloudCover:parseInt(cur.cloudcover||50),
      code,desc:wDesc(code,cur.weatherDesc?.[0]?.value),
      cls:wClass(code),sunrise:srRaw,sunset:ssRaw,
      uvi:parseInt(cur.uvIndex||5),
      highToday:Math.round(parseFloat(todayFc.maxtempC)),
      lowToday:Math.round(parseFloat(todayFc.mintempC)),
    };
    tip=weatherTip(code,hero.temp,hero.humidity);

    // hourly
    const allH=(todayFc.hourly||[]).map(h=>({
      hNum:parseInt(h.time)/100,
      temp:Math.round(parseFloat(h.tempC)),
      code:parseInt(h.weatherCode),
      desc:h.weatherDesc?.[0]?.value||"",
      rain:parseInt(h.chanceofrain||0),
    }));
    let ni=allH.reduce((bi,h,i)=>Math.abs(h.hNum-nowH)<Math.abs(allH[bi].hNum-nowH)?i:bi,0);
    hourly=allH.slice(ni,ni+9).map((h,i)=>({
      label:i===0?'Now':`${h.hNum%12||12} ${h.hNum>=12?'PM':'AM'}`,
      temp:h.temp,icon:wIcon(h.code),rain:h.rain,
    }));

    // daily (3 days)
    daily=wx.weather.slice(0,3).map((d,i)=>{
      const mid=d.hourly?.[4]||d.hourly?.[0]||{};
      const dc=parseInt(mid.weatherCode||113);
      const dt=new Date(d.date);
      const hi=Math.round(parseFloat(d.maxtempC));
      const lo=Math.round(parseFloat(d.mintempC));
      const rainPct=parseInt(mid.chanceofrain||0);
      return{name:i===0?'Today':DAYS[dt.getDay()],hi,lo,icon:wIcon(dc),desc:wDesc(dc,mid.weatherDesc?.[0]?.value),rainPct};
    });
  }

  const aqi=hero?aqiFromHumidity(hero.humidity,hero.code):50;
  const aqiInfo=aqiLabel(aqi);
  const dl=hero?daylight(hero.sunrise,hero.sunset):{pctStart:25,pctLen:50,pctNow:50};

  return(
    <>
      <nav>
        <div className="logo">Weather<span>Wave</span></div>
        <div className="nav-center">
          <div className="search-wrapper">
            <div className="sw">
              <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input ref={inputRef} value={input} onChange={e=>handleInput(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleSearch()} onBlur={()=>setTimeout(()=>setShowSug(false),180)}
                onFocus={()=>input.length>1&&suggests.length>0&&setShowSug(true)}
                placeholder="Search any city…"/>
            </div>
            {showSug&&(
              <div className="autocomplete">
                {suggests.map(c=>(
                  <div key={c} className="autocomplete-item" onMouseDown={()=>pickSuggest(c)}>
                    <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    {c}
                  </div>
                ))}
              </div>
            )}
          </div>
          <button className="btn" onClick={handleSearch}>Search</button>
        </div>
        <div className="nav-actions">
          <div className="unit-toggle">
            <button className={`unit-btn${unit==='C'?' active':''}`} onClick={()=>setUnit('C')}>°C</button>
            <button className={`unit-btn${unit==='F'?' active':''}`} onClick={()=>setUnit('F')}>°F</button>
          </div>
          <div className="icon-btn" title="Use my location" onClick={useLocation}>
            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9" strokeDasharray="3 2"/></svg>
          </div>
          <div className="icon-btn" title="Toggle dark mode" onClick={()=>setDark(d=>!d)}>
            {dark
              ?<svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              :<svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            }
          </div>
          <div className="icon-btn" title="Add to favorites" onClick={addFav}>
            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
        </div>
      </nav>

      <main>
        {/* FAVORITES STRIP */}
        {favorites.length>0&&(
          <div className="fav-strip">
            {favorites.map(city=>{
              const fd=favData[city];
              const ft=fd?Math.round(parseFloat(fd.current_condition[0].temp_C)):null;
              const fi=fd?wIcon(parseInt(fd.current_condition[0].weatherCode)):"🌡️";
              return(
                <div key={city} className="fav-chip" onClick={()=>{setInput(city);setQuery(city);}}>
                  <span>{fi}</span>
                  <span>{city}</span>
                  {ft!==null&&<span className="fav-temp">{dispTempNum(ft,unit)}°</span>}
                  <span className="fav-remove" onClick={e=>removeFav(city,e)}>✕</span>
                </div>
              );
            })}
            <div className="fav-add-btn" onClick={addFav}>
              <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              Save {query.split(',')[0]}
            </div>
          </div>
        )}

        {/* TABS */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12,marginBottom:24}}>
          <div className="tabs">
            {['today','forecast','details','compare'].map(t=>(
              <button key={t} className={`tab${tab===t?' active':''}`} onClick={()=>setTab(t)}>
                {t.charAt(0).toUpperCase()+t.slice(1)}
              </button>
            ))}
          </div>
        </div>

        {/* LOADING */}
        {loading&&(
          <div className="state">
            <div className="spinner"/>
            <p>Fetching weather for <strong>{query}</strong>…</p>
          </div>
        )}
        {!loading&&error&&(
          <div className="state">
            <div style={{fontSize:'3rem'}}>⚠️</div>
            <p style={{color:'#ef4444',fontWeight:600}}>{error}</p>
            <p>Please try a different city name.</p>
          </div>
        )}

        {/* ── TODAY TAB ── */}
        {!loading&&!error&&hero&&tab==='today'&&(
          <>
            <div className="section fu">
              <div className={`hero ${hero.cls}`}>
                <div className="hero-left">
                  <div className="hero-city">{hero.city}</div>
                  <div className="hero-region">{hero.date}</div>
                  <div className="hero-temp">{dispTempNum(hero.temp,unit)}°</div>
                  <div className="hero-feels">Feels like {dispTempNum(hero.feels,unit)}°</div>
                  <div className="hero-stats">
                    <div className="stat"><span className="val">{hero.humidity}%</span><span className="lbl">Humidity</span></div>
                    <div className="stat"><span className="val">{hero.wind} km/h</span><span className="lbl">Wind</span></div>
                    <div className="stat"><span className="val">{hero.visibility} km</span><span className="lbl">Visibility</span></div>
                    <div className="stat"><span className="val">{hero.pressure} hPa</span><span className="lbl">Pressure</span></div>
                    <div className="stat"><span className="val">{hero.cloudCover}%</span><span className="lbl">Cloud Cover</span></div>
                  </div>
                </div>
                <div className="hero-right">
                  <div className="hero-icon">{wIcon(hero.code)}</div>
                  <div className="hero-cond">{hero.desc}</div>
                  <div className="hero-hi-lo">H:{dispTempNum(hero.highToday,unit)}° · L:{dispTempNum(hero.lowToday,unit)}°</div>
                </div>
              </div>
            </div>

            {/* HOURLY */}
            <div className="section fu fu1">
              <div className="sec-title">Hourly Forecast</div>
              <div className="hourly-scroll">
                {hourly.map((h,i)=>(
                  <div key={i} className={`hour-card${activeH===i?' active':''}`} onClick={()=>setActiveH(i)}>
                    <span className="h-time">{h.label}</span>
                    <span className="h-icon">{h.icon}</span>
                    <span className="h-temp">{dispTempNum(h.temp,unit)}°</span>
                    {h.rain>0&&<span className="h-rain">💧{h.rain}%</span>}
                  </div>
                ))}
              </div>
            </div>

            {/* RAIN CHANCE CHART */}
            <div className="section fu fu2">
              <div className="card">
                <div className="sec-title">Rain Probability — Today</div>
                <div className="rain-chart">
                  {hourly.map((h,i)=>(
                    <div key={i} className="rain-bar-wrap">
                      <div className="rain-bar-outer">
                        <div className="rain-bar-inner" style={{height:`${Math.max(h.rain,2)}%`}}/>
                      </div>
                      <span className="rain-bar-label">{h.label}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* GRID ROW */}
            <div className="grid-2 fu fu3" style={{marginBottom:20}}>
              {/* SUN & UV */}
              <div className="card sun-card">
                <div className="sec-title">Sun &amp; UV</div>
                <div className="sun-row">
                  <span className="sun-lbl">🌅 Sunrise</span>
                  <span className="sun-val">{hero.sunrise}</span>
                </div>
                <div className="sun-row">
                  <span className="sun-lbl">🌇 Sunset</span>
                  <span className="sun-val">{hero.sunset}</span>
                </div>
                <div className="sun-row" style={{flexDirection:'column',alignItems:'flex-start',gap:6}}>
                  <div style={{display:'flex',justifyContent:'space-between',width:'100%'}}>
                    <span className="sun-lbl">🌞 UV Index</span>
                    <span className="sun-val">{hero.uvi} — {hero.uvi<=2?'Low':hero.uvi<=5?'Moderate':hero.uvi<=7?'High':'Very High'}</span>
                  </div>
                  <div className="uv-bar" style={{width:'100%'}}>
                    <div className="uv-dot" style={{left:`${Math.min(hero.uvi/11*100,93)}%`}}/>
                  </div>
                </div>
                <div style={{marginTop:16}}>
                  <div className="sun-lbl" style={{marginBottom:8}}>🌄 Daylight Arc</div>
                  <div className="daylight-bar">
                    <div className="daylight-fill" style={{left:`${dl.pctStart}%`,width:`${dl.pctLen}%`}}/>
                    <div className="sun-now-dot" style={{left:`${dl.pctStart+dl.pctNow*dl.pctLen/100}%`}}/>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:'0.72rem',color:'var(--muted)'}}>
                    <span>{hero.sunrise}</span><span>Now</span><span>{hero.sunset}</span>
                  </div>
                </div>
              </div>

              {/* WEATHER TIP */}
              <div className="card tip-card">
                <div className="tip-icon">{tip?.icon}</div>
                <div className="tip-title">{tip?.title}</div>
                <div className="tip-text">{tip?.text}</div>
                <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid rgba(134,239,172,0.3)'}}>
                  <div className="sec-title" style={{marginBottom:8}}>What to Wear</div>
                  <div style={{fontSize:'0.9rem',lineHeight:1.6,color:'var(--text)'}}>
                    {hero.temp>=35?'👕 Light, breathable clothing — linen or cotton. Sunglasses & sunscreen.':
                     hero.temp>=25?'👔 Comfortable summer wear. A light layer for evenings.':
                     hero.temp>=15?'🧥 Light jacket or cardigan. Layers work well.':
                     hero.temp>=5?'🧤 Warm coat, gloves, and a scarf. Layer up!':
                     '🧣 Heavy winter gear — thermal layers, waterproof boots.'}
                  </div>
                </div>
              </div>
            </div>

            {/* AQI */}
            <div className="card aqi-card fu fu4">
              <div className="sec-title">Air Quality Index</div>
              <div className="aqi-top">
                <div className="aqi-status" style={{color:aqiInfo.color}}>Overall: {aqiInfo.label} — {aqi<=50?'Safe for all activities':aqi<=100?'Acceptable for most':'Sensitive groups should limit outdoor exposure'}</div>
                <div className="aqi-badge">AQI {aqi}</div>
              </div>
              <div className="aqi-bar">
                <div className="aqi-dot" style={{left:`${aqiInfo.pct}%`}}/>
              </div>
              <div className="aqi-scale">
                <span>Good</span><span>Moderate</span><span>Unhealthy</span><span>Hazardous</span>
              </div>
            </div>
          </>
        )}

        {/* ── FORECAST TAB ── */}
        {!loading&&!error&&hero&&tab==='forecast'&&(
          <>
            <div className="section fu">
              <div className="card">
                <div className="sec-title">3-Day Forecast</div>
                {daily.map((d,i)=>{
                  const range=d.hi-d.lo||1;
                  const minT=Math.min(...daily.map(x=>x.lo));
                  const maxT=Math.max(...daily.map(x=>x.hi));
                  const totalRange=maxT-minT||1;
                  const barLeft=((d.lo-minT)/totalRange)*100;
                  const barW=((d.hi-d.lo)/totalRange)*100;
                  return(
                    <div key={i} className="day-row">
                      <span className="day-name">{d.name}</span>
                      <span className="day-icon-col">{d.icon}</span>
                      <span className="day-cond">{d.desc}</span>
                      <div className="day-temp-bar">
                        <span className="day-low">{dispTempNum(d.lo,unit)}°</span>
                        <div className="temp-range">
                          <div className="temp-range-fill" style={{left:`${barLeft}%`,width:`${barW}%`}}/>
                        </div>
                        <span className="day-high">{dispTempNum(d.hi,unit)}°</span>
                      </div>
                      <span className="day-rain-pct">💧{d.rainPct}%</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Hourly for each day */}
            {wx.weather.slice(0,3).map((d,di)=>{
              const dt=new Date(d.date);
              const dayLabel=di===0?'Today':di===1?'Tomorrow':DAYS[dt.getDay()];
              return(
                <div key={di} className="section fu fu1">
                  <div className="sec-title">{dayLabel} — Hourly Breakdown</div>
                  <div className="hourly-scroll">
                    {(d.hourly||[]).map((h,i)=>{
                      const hNum=parseInt(h.time)/100;
                      const ap=hNum>=12?'PM':'AM';
                      const label=`${hNum%12||12}${ap}`;
                      const t=Math.round(parseFloat(h.tempC));
                      const rain=parseInt(h.chanceofrain||0);
                      return(
                        <div key={i} className="hour-card">
                          <span className="h-time">{label}</span>
                          <span className="h-icon">{wIcon(parseInt(h.weatherCode))}</span>
                          <span className="h-temp">{dispTempNum(t,unit)}°</span>
                          {rain>0&&<span className="h-rain">💧{rain}%</span>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </>
        )}

        {/* ── DETAILS TAB ── */}
        {!loading&&!error&&hero&&tab==='details'&&(
          <>
            {/* AIR DETAILS */}
            <div className="section fu">
              <div className="card">
                <div className="sec-title">Air Details</div>
                <div className="air-grid">
                  <div><div className="air-lbl">Humidity</div><div className="air-val">{hero.humidity}<small> %</small></div><div className="air-bar"><div className="air-fill" style={{width:`${hero.humidity}%`}}/></div></div>
                  <div><div className="air-lbl">Wind Speed</div><div className="air-val">{hero.wind}<small> km/h</small></div><div className="air-bar"><div className="air-fill" style={{width:`${Math.min(hero.wind/80*100,100)}%`}}/></div></div>
                  <div><div className="air-lbl">Visibility</div><div className="air-val">{hero.visibility}<small> km</small></div><div className="air-bar"><div className="air-fill" style={{width:`${Math.min(hero.visibility/10*100,100)}%`}}/></div></div>
                  <div><div className="air-lbl">Pressure</div><div className="air-val">{hero.pressure}<small> hPa</small></div><div className="air-bar"><div className="air-fill" style={{width:`${Math.min((hero.pressure-950)/100*100,100)}%`}}/></div></div>
                  <div><div className="air-lbl">Cloud Cover</div><div className="air-val">{hero.cloudCover}<small> %</small></div><div className="air-bar"><div className="air-fill" style={{width:`${hero.cloudCover}%`}}/></div></div>
                  <div><div className="air-lbl">UV Index</div><div className="air-val">{hero.uvi}<small>/11</small></div><div className="air-bar"><div className="air-fill" style={{width:`${hero.uvi/11*100}%`}}/></div></div>
                </div>
              </div>
            </div>

            <div className="grid-2 fu fu1" style={{marginBottom:20}}>
              {/* WIND COMPASS */}
              <div className="card">
                <div className="sec-title">Wind Details</div>
                <div className="compass-wrap">
                  <div className="compass">
                    <div className="compass-ring"/>
                    <span className="compass-dir n">N</span>
                    <span className="compass-dir s">S</span>
                    <span className="compass-dir e">E</span>
                    <span className="compass-dir w">W</span>
                    <div className="compass-needle" style={{transform:`rotate(${hero.windDir}deg)`}}/>
                    <div className="compass-center"/>
                  </div>
                  <div className="wind-stats">
                    <div className="wind-stat"><div className="wind-stat-val">{hero.wind}</div><div className="wind-stat-lbl">Speed km/h</div></div>
                    <div className="wind-stat"><div className="wind-stat-val">{hero.windDirStr}</div><div className="wind-stat-lbl">Direction</div></div>
                  </div>
                </div>
              </div>

              {/* FEELS LIKE */}
              <div className="card feels-card">
                <div className="sec-title">Feels Like</div>
                <div className="feels-big">{dispTempNum(hero.feels,unit)}°</div>
                <div className="feels-desc">{feelsDesc(hero.feels,hero.temp)}</div>
                <div style={{marginTop:20,display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  <div><div className="air-lbl">Actual Temp</div><div style={{fontSize:'1.4rem',fontWeight:600}}>{dispTempNum(hero.temp,unit)}°</div></div>
                  <div><div className="air-lbl">Difference</div><div style={{fontSize:'1.4rem',fontWeight:600,color:hero.feels>hero.temp?'#ef4444':'#3b82f6'}}>{hero.feels>hero.temp?'+':''}{dispTempNum(hero.feels-hero.temp,unit).replace('°','°')}</div></div>
                  <div><div className="air-lbl">Humidity</div><div style={{fontSize:'1.4rem',fontWeight:600}}>{hero.humidity}%</div></div>
                  <div><div className="air-lbl">Wind Speed</div><div style={{fontSize:'1.4rem',fontWeight:600}}>{hero.wind} km/h</div></div>
                </div>
              </div>
            </div>

            {/* LOCATION MAP */}
            <div className="card map-card fu fu2">
              <div className="map-inner">
                <div className="map-rings">
                  <div className="ring"/><div className="ring"/><div className="ring"/>
                </div>
                <div className="map-pin">📍</div>
                <div className="map-label">📍 {hero.city}</div>
              </div>
            </div>
          </>
        )}

        {/* ── COMPARE TAB ── */}
        {!loading&&!error&&hero&&tab==='compare'&&(
          <>
            <div className="section fu">
              <div className="card">
                <div className="sec-title">Compare Cities</div>
                <div className="compare-input-row">
                  <input className="compare-input" value={query} readOnly placeholder="Primary city"/>
                  <span style={{display:'flex',alignItems:'center',color:'var(--muted)',fontWeight:700,fontSize:'1.2rem'}}>vs</span>
                  <input className="compare-input" value={compareInput} onChange={e=>setCompareInput(e.target.value)}
                    onKeyDown={e=>e.key==='Enter'&&doCompare()} placeholder="Compare with…"/>
                  <button className="btn" onClick={doCompare}>Compare</button>
                </div>
                {compareLoading&&<div style={{textAlign:'center',padding:20,color:'var(--muted)'}}>Loading…</div>}
                {!compareLoading&&compareWx&&(()=>{
                  const cc=compareWx.current_condition[0];
                  const cTemp=Math.round(parseFloat(cc.temp_C));
                  const cCode=parseInt(cc.weatherCode);
                  const diff=hero.temp-cTemp;
                  const rows=[
                    {lbl:'Temperature',a:dispTemp(hero.temp,unit),b:dispTemp(cTemp,unit)},
                    {lbl:'Feels Like',a:dispTemp(hero.feels,unit),b:dispTemp(Math.round(parseFloat(cc.FeelsLikeC)),unit)},
                    {lbl:'Humidity',a:`${hero.humidity}%`,b:`${cc.humidity}%`},
                    {lbl:'Wind',a:`${hero.wind} km/h`,b:`${cc.windspeedKmph} km/h`},
                    {lbl:'Visibility',a:`${hero.visibility} km`,b:`${cc.visibility} km`},
                    {lbl:'Pressure',a:`${hero.pressure} hPa`,b:`${cc.pressure} hPa`},
                  ];
                  return(
                    <>
                      <div className="compare-grid">
                        <div className="compare-city">
                          <div className="compare-name">{hero.city}</div>
                          <div style={{fontSize:'3.5rem',margin:'8px 0'}}>{wIcon(hero.code)}</div>
                          <div className="compare-temp">{dispTempNum(hero.temp,unit)}°</div>
                          <div className="compare-cond">{hero.desc}</div>
                        </div>
                        <div className="compare-vs">vs</div>
                        <div className="compare-city">
                          <div className="compare-name">{compareCity.split(',')[0]}</div>
                          <div style={{fontSize:'3.5rem',margin:'8px 0'}}>{wIcon(cCode)}</div>
                          <div className="compare-temp">{dispTempNum(cTemp,unit)}°</div>
                          <div className="compare-cond">{wDesc(cCode,cc.weatherDesc?.[0]?.value)}</div>
                        </div>
                      </div>
                      <div className="compare-diff">
                        <strong>{hero.city}</strong> is {Math.abs(diff)}° {diff>0?'warmer':'cooler'} than <strong>{compareCity.split(',')[0]}</strong>
                      </div>
                      <div style={{marginTop:24}}>
                        <div className="sec-title">Side-by-Side</div>
                        {rows.map((r,i)=>(
                          <div key={i} style={{display:'flex',alignItems:'center',padding:'10px 0',borderBottom:'1px solid rgba(180,210,240,0.2)',gap:12}}>
                            <span style={{flex:1,fontWeight:700,fontSize:'0.88rem'}}>{r.a}</span>
                            <span style={{color:'var(--muted)',fontSize:'0.8rem',width:90,textAlign:'center'}}>{r.lbl}</span>
                            <span style={{flex:1,textAlign:'right',fontWeight:700,fontSize:'0.88rem'}}>{r.b}</span>
                          </div>
                        ))}
                      </div>
                    </>
                  );
                })()}
              </div>
            </div>
          </>
        )}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
